<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none';" />
  <title>DevFusion · Reading text</title>
  <style>body{margin:0;background:#171923;color:#f5f5f7;font:14px system-ui;padding:28px}h1{font-size:20px}p{color:#b9becb}progress{width:100%;accent-color:#818cf8}button{padding:10px 18px;border:1px solid #454958;border-radius:8px;background:#292d3d;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #a5b4fc}small{display:block;color:#b9becb;margin:18px 0}</style>
  <style>@media(prefers-color-scheme:light){body{background:#f5f6f9;color:#1c1c1e}p,small{color:#5b6170}button{background:#fff;border-color:#d2d5dd}}</style>
</head>
<body>
  <h1 data-message="Reading text locally"></h1><p id="status" role="status" aria-live="polite" data-message="Preparing…"></p>
  <progress id="progress" max="100" value="0" data-message-aria="OCR progress"></progress>
  <small data-message="Nothing is uploaded. Cancel closes the engine and releases its memory."></small>
  <button id="cancel" type="button" data-message="Cancel"></button>
  <script type="module" src="./src/ocr-helper/index.ts"></script>
</body>
</html>
