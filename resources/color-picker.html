<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>DevFusion · Color Picker</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #151829; color: #edf0ff; --control: #242940; --secondary: #b8c1d9; --line: #3c4563; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; }
    [hidden] { display: none !important; }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
    .brand { display:flex; align-items:center; gap:9px; margin-bottom:12px; font-size:12px; color:var(--secondary); }
    .brand img { width:24px; height:24px; object-fit:contain; flex-shrink:0; }
    .brand span { margin-left:auto; }
    button, input { font: inherit; }
    button { cursor: pointer; color: inherit; border: 1px solid var(--line); background: var(--control); border-radius: 8px; padding: 7px 12px; font-size: 12px; }
    button:hover { filter: brightness(1.15); }
    button:disabled { cursor: default; opacity: .6; }
    :focus-visible { outline: 2px solid #59a9ff; outline-offset: 2px; }
    #swatch { border-radius: 14px; padding: 18px; height: 96px; display: flex; flex-direction: column; justify-content: center; margin-bottom: 14px; }
    #selected-hex { font: 600 24px ui-monospace, monospace; }
    #contrast { font-size: 11px; margin-top: 4px; opacity: .85; }
    .field { display: flex; align-items: center; gap: 8px; margin: 8px 0; background: var(--control); padding: 6px 8px; border-radius: 9px; }
    .field label { width: 30px; font-size: 10px; color: var(--secondary); font-weight: 600; }
    .field input { min-width: 0; width: 0; flex: 1; padding: 5px 0; color: inherit; background: transparent; border: 0; font: 11px ui-monospace, monospace; }
    .field button { padding: 5px 7px; font-size: 11px; }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    #repick { flex: 1; background: #087cff; border-color: #087cff; color: white; font-weight: 600; }
    #status { font-size: 11px; min-height: 30px; line-height: 1.5; margin: 12px 0 0; color: var(--secondary); }
    body.overlay { padding: 0; overflow: hidden; cursor: crosshair; }
    #desktop { position: fixed; inset: 0; width: 100%; height: 100%; }
    #hint { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; border-radius: 10px; background: #151829ed; color: #edf0ff; padding: 10px 14px; font-size: 12px; box-shadow: 0 4px 20px #0005; white-space: nowrap; pointer-events: none; }
    #cancel { pointer-events: auto; }
    #lens { position: fixed; pointer-events: none; width: 130px; border: 2px solid #fff; border-radius: 12px; overflow: hidden; background: #151829; color: white; box-shadow: 0 4px 20px #0007; }
    #zoom { display: block; width: 126px; height: 126px; image-rendering: pixelated; }
    #hover-hex { display: block; padding: 6px; text-align: center; font: 12px ui-monospace, monospace; }
    @media (prefers-color-scheme: light) { :root { background: #f5f6fa; color: #171c2c; --control: #e9edf5; --secondary: #58657f; --line: #d4dbe9; } }
  </style>
</head>
<body>
  <section id="result" hidden>
    <div class="brand"><img src="icon.png" alt=""><strong>DevFusion</strong><span>Color Picker</span></div>
    <div id="swatch"><strong id="selected-hex"></strong><span id="contrast"></span></div>
    <div id="fields"></div>
    <div class="actions"><button id="repick" type="button">Pick another color</button><button id="close" type="button">Close</button></div>
    <p id="status" role="status" aria-live="polite">Choose a format to copy. Esc closes this popup.</p>
  </section>
  <section id="overlay" hidden>
    <canvas id="desktop"></canvas>
    <div id="hint"><span>Click a screen color to select it</span><button id="cancel" type="button">Cancel · Esc</button></div>
    <div id="lens" hidden><canvas id="zoom" width="126" height="126"></canvas><output id="hover-hex"></output></div>
  </section>
  <script src="color-picker.js"></script>
</body>
</html>
