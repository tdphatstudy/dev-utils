name: Signed desktop artifacts
# Builds reviewable artifacts only. Nothing is published or deployed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
          - os: macos-14
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    environment: desktop-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pnpm typecheck
      - run: pnpm test:i18n:coverage
      - run: pnpm test --maxWorkers=4
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui:enterprise
      - run: pnpm test:ui:security-testing
      - run: pnpm test:ui:i18n
      - run: node tests/quick-tools-ui.smoke.mjs
      - run: pnpm test:ui:release
      - run: pnpm test:electron:drafts
      - run: pnpm test:electron:security
      - run: node tests/electron-quick-tools.smoke.mjs
      - name: Build signed Windows artifacts
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: pnpm exec electron-builder --win --${{ matrix.arch }} --config electron-builder.signed.yml --publish never
      - name: Build signed and notarized macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY="$RUNNER_TEMP/devfusion-notarize.p8"
          node -e "require('fs').writeFileSync(process.env.APPLE_API_KEY, Buffer.from(process.env.APPLE_API_KEY_BASE64 || '', 'base64'), { mode: 0o600 })"
          trap 'rm -f -- "$APPLE_API_KEY"' EXIT
          pnpm exec electron-builder --mac --${{ matrix.arch }} --config electron-builder.signed.yml --publish never
      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath release -Filter '*.exe' -File)
          if ($artifacts.Count -eq 0) { throw 'No signed installer produced.' }
          $artifacts += Get-Item -LiteralPath release/win-unpacked/DevFusion.exe
          foreach ($artifact in $artifacts) {
            if ((Get-AuthenticodeSignature -LiteralPath $artifact.FullName).Status -ne 'Valid') { throw "Invalid signature: $($artifact.Name)" }
          }
      - name: Verify macOS signatures and notarization tickets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="release/mac/DevFusion.app"
          if [ '${{ matrix.arch }}' = 'arm64' ]; then app="release/mac-arm64/DevFusion.app"; fi
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - run: node scripts/artifact-manifest.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-desktop-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/DevFusion-*.exe
            release/DevFusion-*.dmg
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
