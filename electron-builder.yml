appId: com.devutils.app
productName: DevFusion
copyright: Copyright © DevFusion
directories:
  output: release
  buildResources: resources

# Smaller app.asar + faster install/extract
asar: true
compression: maximum

# Drop unused Chromium/Electron locales from the package
electronLanguages:
  - en-US

files:
  - out/**/*
  - package.json
  - '!**/*.{map,ts,tsx,md}'
  - '!**/._*'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme,test,tests,__tests__,docs}/**'
  - '!**/node_modules/.bin/**'

extraResources:
  - from: resources/menu-icons
    to: menu-icons
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/tray.png
    to: tray.png
  - from: resources/tray.ico
    to: tray.ico
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: resources/color-picker.html
    to: color-picker.html
  - from: resources/color-picker.js
    to: color-picker.js
  - from: resources/ocr-helper.html
    to: ocr-helper.html
  - from: resources/ocr-helper.js
    to: ocr-helper.js

# Root icon for all platforms (buildResources = resources/)
icon: icon.png

# Apply and verify Electron security fuses before signing on every platform.
# Also embed the Windows icon without requiring winCodeSign in local builds.
afterPack: scripts/after-pack.mjs

win:
  icon: icon.ico
  # Skip winCodeSign rcedit (symlink privilege on Windows); icon applied in afterPack
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DevFusion
  deleteAppDataOnUninstall: false

mac:
  minimumSystemVersion: '13.0'
  icon: icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Signing / notarization require Apple certs — enable when available:
  # hardenedRuntime: true
  # gatekeeperAssess: false

linux:
  # Match the reverse-DNS Wayland global-shortcut portal identity.
  executableName: com.devutils.app
  icon: icon.png
  category: Development
  synopsis: Local developer toolbox
  description: Offline developer utilities — JSON, YAML, crypto, HTTP, Secret Box, Keep.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
