appId: com.devutils.app
productName: DevUtils
copyright: Copyright © DevUtils
directories:
  output: release
  buildResources: resources

# Smaller app.asar + faster install/extract
asar: true
compression: maximum

# Drop unused Chromium/Electron locales from the package
electronLanguages:
  - en-US

files:
  - out/**/*
  - package.json
  - '!**/*.{map,ts,tsx,md}'
  - '!**/._*'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme,test,tests,__tests__,docs}/**'
  - '!**/node_modules/.bin/**'

extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico

# Root icon for all platforms (buildResources = resources/)
icon: icon.png

# Embed custom icon into .exe without winCodeSign (see scripts/after-pack.mjs)
afterPack: scripts/after-pack.mjs

win:
  icon: icon.ico
  # Skip winCodeSign rcedit (symlink privilege on Windows); icon applied in afterPack
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DevUtils
  deleteAppDataOnUninstall: false

mac:
  icon: icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Signing / notarization require Apple certs — enable when available:
  # hardenedRuntime: true
  # gatekeeperAssess: false

linux:
  icon: icon.png
  category: Development
  synopsis: Local developer toolbox
  description: Offline developer utilities — JSON, YAML, crypto, HTTP, Secret Box, Keep.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
